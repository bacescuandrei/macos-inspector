[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macos-inspector"
version = "1.2.6"
description = "macOS security auditing, DFIR triage, and guarded process response framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "macOS Inspector contributors"}]
keywords = ["macos", "security", "dfir", "incident-response", "digital-forensics", "threat-hunting", "yara"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/bacescuandrei/macos-inspector"
Repository = "https://github.com/bacescuandrei/macos-inspector.git"
Issues = "https://github.com/bacescuandrei/macos-inspector/issues"
Changelog = "https://github.com/bacescuandrei/macos-inspector/blob/main/CHANGELOG.md"

[project.scripts]
macos-inspector = "macos_inspector.cli:main"

[project.optional-dependencies]
signing = ["cryptography>=42.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"macos_inspector.webui" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
