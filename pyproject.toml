[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macos-inspector"
version = "0.1.0"
description = "Read-only macOS security auditing and DFIR framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "macOS Inspector contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
macos-inspector = "macos_inspector.cli:main"

[project.optional-dependencies]
pdf = ["reportlab>=4.0"]
signing = ["cryptography>=42.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"macos_inspector.webui" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
