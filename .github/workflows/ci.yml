name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional cryptography support
        run: python -m pip install "cryptography>=42.0"
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Check dashboard JavaScript syntax
        run: node --check src/macos_inspector/webui/app.js

  package:
    name: Build portable package
    runs-on: macos-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build package
        env:
          PYTHONPATH: src
        run: python -m scripts.build_release
      - name: Verify package contents
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Record checksum
        run: shasum -a 256 dist/macos-inspector-*-macos.zip | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-inspector-macos
          path: |
            dist/macos-inspector-*-macos.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
