name: Bug report
description: Report a reproducible problem in macOS Inspector.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach reports that contain host, user, case, or investigation data. Remove sensitive evidence before sharing a sample.
  - type: input
    id: version
    attributes:
      label: macOS Inspector version
      placeholder: 1.2.3
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and build
      placeholder: macOS 15.6, build 24G84
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - Apple silicon
        - Intel
        - Unknown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: sanitized
    attributes:
      label: Sanitized diagnostic details
      description: Remove hostnames, usernames, paths, tokens, indicators, and case data.
